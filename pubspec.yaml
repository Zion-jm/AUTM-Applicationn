name: automato
description: AuTOMATO - IoT Greenhouse Monitoring App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.1.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.0.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  firebase_database: ^11.3.10 
  lottie: ^3.1.2 
  image_picker: ^1.1.2
  fl_chart: ^0.70.2
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  http: ^1.2.1
  path_provider: ^2.1.2
  path: ^1.8.3
  image: ^4.1.3
  video_player: ^2.8.1
  chewie: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/AUTM-Logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F9F5F0"
  adaptive_icon_foreground: "assets/icon/AUTM-Logo.png"


flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/icon/tomato-growth.json
    - assets/videos/